name: CI - Web App

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "agents/**"
      - "docs/**"
      - ".kiro/**"
      - "*.md"

jobs:
  quality:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係のインストール
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: 型チェック
        run: npx tsc --noEmit

      - name: テスト
        run: npm run test

      # 要件 18.16: 本検証は専用の Vector_Table 方式を採る前提のため、
      # 既存検証の測定結果である docs/opensearch-comparison.md は無変更でなければならない。
      - name: docs/opensearch-comparison.md の無変更確認
        run: git diff --exit-code -- docs/opensearch-comparison.md
